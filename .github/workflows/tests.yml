name: Scraper tests

# GAT, nem emlekezteto: a 2026-09-14-i gyoker-javitas harom hibaosztalyt orzo
# tesztje csak akkor er valamit, ha gepileg is lefut. Korabban csak kezzel futott.
on:
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "scraper/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  test:
    # SZANDEKOSAN macOS: a rendszer elesben launchd alol, /bin/zsh-vel fut, es a
    # javitott hibak egyike (RED1 F-1) KIFEJEZETTEN zsh-szemantika volt — a
    # `set +e` ott nem kapcsolja ki a `trap ERR`-t. Linux/bash alatt a teszt mast
    # merne, mint ami elesben tortenik.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # SZANDEKOSAN a rendszer sajat ertelmezoje: a launchd `/usr/bin/python3`-at
      # hiv, ami macOS-en 3.9.x. Ha a CI 3.11-et merne, egy 3.10+ szintaxis
      # atmenne a kapun es elesben bukna. (RED1 2. kor megjegyzese.)
      - name: Ertelmezo (a produkcios utvonal)
        run: /usr/bin/python3 --version
      - name: Fuggosegek
        run: /usr/bin/python3 -m pip install --user --disable-pip-version-check -r scraper/requirements.txt
      - name: Halozat nelkuli regresszios tesztek
        run: /usr/bin/python3 scraper/test_partial_failure.py
